<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MediShield SOC security lifecycle</title>
  <desc id="desc">Application activity becomes audit telemetry, is collected by Wazuh, evaluated by custom rules, and investigated through documented incident and privacy workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d2339"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c4a6e"/><stop offset="1" stop-color="#075985"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#134e4a"/><stop offset="1" stop-color="#115e59"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .flow { stroke-dasharray:8 10; animation:flow 2.4s linear infinite; }
      .dot { animation:pulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .d1 { animation-delay:.4s }.d2 { animation-delay:.8s }.d3 { animation-delay:1.2s }
      @keyframes flow { to { stroke-dashoffset:-36; } }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.8) } 50% { opacity:1; transform:scale(1.25) } }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <path d="M30 72H1170M30 367H1170" stroke="#16405d" opacity=".7"/>
  <text x="54" y="49" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">MEDISHIELD SOC · VERIFIED SECURITY LIFECYCLE</text>
  <text x="1146" y="49" text-anchor="end" fill="#6b8aa3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">SYNTHETIC DATA · ISOLATED LAB</text>

  <g stroke="#7dd3fc" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path class="flow" d="M276 145H331"/><path class="flow" d="M568 145H623"/><path class="flow" d="M860 145H915"/>
    <path class="flow" d="M1035 202V244H225V277"/>
    <path class="flow" d="M276 326H331"/><path class="flow" d="M568 326H623"/><path class="flow" d="M860 326H915"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(42 94)"><rect width="234" height="102" rx="15" fill="url(#blue)" stroke="#38bdf8"/><text x="20" y="31" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.5">01 · ACTIVITY</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Healthcare application</text><text x="20" y="82" fill="#bae6fd" font-size="13">authorized + denied access</text></g>
    <g transform="translate(334 94)"><rect width="234" height="102" rx="15" fill="url(#blue)" stroke="#38bdf8"/><text x="20" y="31" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.5">02 · TELEMETRY</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">HMAC-chained audit</text><text x="20" y="82" fill="#bae6fd" font-size="13">structured + pseudonymized</text></g>
    <g transform="translate(626 94)"><rect width="234" height="102" rx="15" fill="url(#blue)" stroke="#38bdf8"/><text x="20" y="31" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.5">03 · COLLECTION</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Wazuh agent</text><text x="20" y="82" fill="#bae6fd" font-size="13">Windows endpoint</text></g>
    <g transform="translate(918 94)"><rect width="234" height="102" rx="15" fill="url(#blue)" stroke="#38bdf8"/><text x="20" y="31" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.5">04 · DETECTION</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Wazuh manager</text><text x="20" y="82" fill="#bae6fd" font-size="13">custom rules 110101–110104</text></g>

    <g transform="translate(42 275)"><rect width="234" height="102" rx="15" fill="url(#teal)" stroke="#2dd4bf"/><text x="20" y="31" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.5">05 · ALERT</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Validated evidence</text><text x="20" y="82" fill="#99f6e4" font-size="13">human-reviewed snapshot</text></g>
    <g transform="translate(334 275)"><rect width="234" height="102" rx="15" fill="url(#teal)" stroke="#2dd4bf"/><text x="20" y="31" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.5">06 · TRIAGE</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Analyst investigation</text><text x="20" y="82" fill="#99f6e4" font-size="13">context + evidence + disposition</text></g>
    <g transform="translate(626 275)"><rect width="234" height="102" rx="15" fill="url(#teal)" stroke="#2dd4bf"/><text x="20" y="31" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.5">07 · INCIDENT</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Case documentation</text><text x="20" y="82" fill="#99f6e4" font-size="13">Incident #001 resolved</text></g>
    <g transform="translate(918 275)"><rect width="234" height="102" rx="15" fill="url(#teal)" stroke="#2dd4bf"/><text x="20" y="31" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.5">08 · REVIEW</text><text x="20" y="59" fill="#fff" font-size="17" font-weight="700">Privacy assessment</text><text x="20" y="82" fill="#99f6e4" font-size="13">independent documented outcome</text></g>
  </g>
  <g fill="#67e8f9" filter="url(#glow)"><circle class="dot" cx="304" cy="145" r="4"/><circle class="dot d1" cx="596" cy="145" r="4"/><circle class="dot d2" cx="888" cy="145" r="4"/><circle class="dot d3" cx="596" cy="326" r="4"/></g>
  <text x="600" y="413" text-anchor="middle" fill="#7894aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Application evidence → detection logic → analyst judgment → accountable documentation</text>
</svg>
