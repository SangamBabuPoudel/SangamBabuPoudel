<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Security operations home lab architecture</title>
  <desc id="desc">Windows telemetry moves through Sysmon and the Wazuh pipeline to dashboard investigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10283f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.dash{stroke-dasharray:9 11;animation:flow 2s linear infinite}.packet{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-40}}@keyframes pulse{0%,100%{opacity:.4;transform:scale(.75)}50%{opacity:1;transform:scale(1.3)}}</style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="54" y="48" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">SECURITY OPERATIONS HOME LAB</text>
  <text x="1146" y="48" text-anchor="end" fill="#6b8aa3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">ENDPOINT → SIEM → INVESTIGATION</text>
  <path d="M55 68H1145" stroke="#1e4965"/>
  <path class="dash" d="M175 171H1025" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(80 111)"><rect width="190" height="120" rx="17" fill="#0c4a6e" stroke="#38bdf8"/><text x="95" y="34" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.3">ENDPOINT</text><text x="95" y="65" fill="#fff" font-size="17" font-weight="700">Windows activity</text><text x="95" y="91" fill="#bae6fd" font-size="12">process · service · network</text></g>
    <g transform="translate(293 111)"><rect width="190" height="120" rx="17" fill="#0b3b5b" stroke="#38bdf8"/><text x="95" y="34" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.3">TELEMETRY</text><text x="95" y="65" fill="#fff" font-size="17" font-weight="700">Sysmon + Event Logs</text><text x="95" y="91" fill="#bae6fd" font-size="12">security-relevant events</text></g>
    <g transform="translate(506 111)"><rect width="190" height="120" rx="17" fill="#0b3b5b" stroke="#38bdf8"/><text x="95" y="34" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.3">FORWARDING</text><text x="95" y="65" fill="#fff" font-size="17" font-weight="700">Wazuh agent</text><text x="95" y="91" fill="#bae6fd" font-size="12">endpoint collection</text></g>
    <g transform="translate(719 111)"><rect width="190" height="120" rx="17" fill="#134e4a" stroke="#2dd4bf"/><text x="95" y="34" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.3">ANALYSIS</text><text x="95" y="65" fill="#fff" font-size="17" font-weight="700">Manager + Indexer</text><text x="95" y="91" fill="#99f6e4" font-size="12">rule evaluation + search</text></g>
    <g transform="translate(932 111)"><rect width="190" height="120" rx="17" fill="#134e4a" stroke="#2dd4bf"/><text x="95" y="34" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.3">INVESTIGATION</text><text x="95" y="65" fill="#fff" font-size="17" font-weight="700">Dashboard + analyst</text><text x="95" y="91" fill="#99f6e4" font-size="12">validate · pivot · document</text></g>
  </g>
  <g fill="#67e8f9" filter="url(#glow)"><circle class="packet" cx="280" cy="171" r="5"/><circle class="packet" cx="493" cy="171" r="5" style="animation-delay:.5s"/><circle class="packet" cx="706" cy="171" r="5" style="animation-delay:1s"/><circle class="packet" cx="919" cy="171" r="5" style="animation-delay:1.5s"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="322" y="273" width="556" height="44" rx="22" fill="#0c2136" stroke="#234d68"/><circle cx="350" cy="295" r="6" fill="#2dd4bf"/><text x="370" y="300" fill="#b8c9dc" font-size="14">Troubleshooting and evidence validation are documented at every stage.</text></g>
</svg>
